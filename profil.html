<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevScope</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="shortlist.html"></script>
</head>

<body class="bg-indigo-950">
    <header class="flex justify-center items-center m-5">
        <div class="grid grid-row bg-indigo-900 w-350 h-30 rounded-2xl">
            <div class="justify-start">
                <h1 class="font-bold text-white m-5 lg:text-4xl text-2xl">DevScope</h1>
            </div>
            <div class="text-white ml-auto justify-end mb-10">
                <a href="index.html"
                    class="m-10 bg-indigo-950 p-2 rounded-2xl hover:bg-gray-800 transition-color">Recherche</a>
                <a href="shortlist.html" class="m-10 rounded-2xl p-2 hover:bg-gray-800 transition-color">shortlist</a>
            </div>
        </div>
    </header>
    <main class=" lg:w-350 lg:justify-center lg:items-center">
        <form id="formProfil" class="flex bg-indigo-900 text-white rounded-2xl lg:m-10 max-sm:m-2">
            <input id="devTwo" type="text" placeholder="entrez un nom d'utilisateur..." class="bg-indigo-950 m-5 p-5 rounded-2xl w-full">
            <button id="analyse" class="bg-indigo-950 m-5 p-2 hover:bg-indigo-800 transition-color rounded-2xl ml-auto justify-end">Analyse</button>
        </form>
        <div id="errorPage" class="text-white font-bold justify-center text-center items-center"></div>
    </main>
</body>
<script type="module" src="script.js" defer></script>
<script type="module" src="storage.js" defer></script>

</html>
