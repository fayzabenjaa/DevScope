<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevScope</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="shortlist.html"></script>
</head>

<body class="bg-violet-900">
    <header class="flex justify-center items-center m-5">
        <div class="grid grid-row bg-indigo-950 w-350 h-30 rounded-2xl">
            <div class="justify-start">
                <h1 class="font-bold text-white m-5">DevScope</h1>
            </div>
            <div class="text-white ml-auto justify-end mb-10">
                <a href="index.html"
                    class="m-10 bg-violet-700 p-2 rounded-2xl hover:bg-violet-800 transition-color">Recherche</a>
                <a href="shortlist.html" class="m-10 rounded-2xl p-2 hover:bg-violet-800 transition-color">shortlist</a>
            </div>
        </div>
    </header>
    <main class="grid grid-cols-2 w-350 justify-center items-center">
        <div class="text-white m-10">
            <h1 class="font-bold ">Trouvez les meilleurs développeurs gràce à leur code</h1>
            <p>Analyse un profile, ses projets et ses langages en quelques secondes.</p>
        </div>
        <div class="flex bg-indigo-950 text-white rounded-2xl">
            <input type="text" placeholder="entrez un nom d'utilisateur..." class="bg-violet-800 m-5 p-2 rounded-2xl w-full">
            <button class="bg-violet-700 m-5 p-2 hover:bg-violet-800 transition-color rounded-2xl ml-auto justify-end">Analyse</button>
        </div>
    </main>
</body>
<script type="module" src="script.js" defer></script>

</html>
