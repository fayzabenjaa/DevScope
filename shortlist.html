
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevScope</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-[#11152F] via-[#29205C] to-[#49318B] bg-fixed">
    <header class="lg:flex max-sm:grid max-sm:grid-rows   justify-center items-center m-5">
        <nav class="flex flex-col sm:flex-row items-center justify-between
                gap-4 bg-indigo-900 rounded-2xl
                w-full max-w-7xl mx-auto px-5 py-5">
            <a href="index.html"
           class="text-white font-bold text-3xl lg:text-4xl">
            <i class="fa-brands fa-github mr-2"></i>
            DevScope
        </a>
            <div class="flex items-center justify-center gap-3 sm:gap-5 w-full sm:w-auto">

            <a href="index.html"
               class="text-white px-5 py-3 rounded-2xl
                      font-bold text-sm sm:text-base
                      hover:bg-[#8B5CF6] hover:scale-105
                      transition-all duration-300">
                Recherche
            </a>

            <a href="shortlist.html"
                      class="text-[#201744] bg-[#A78BFA] px-5 py-3
                      rounded-2xl font-bold text-sm sm:text-base
                      hover:bg-[#8B5CF6] hover:scale-105
                      transition-all duration-300">
                Shortlist
            </a>

        </div>
        </nav>
    </header>
    <main>
        <div class="text-white m-10">
            <h1 class="m-5 font-bold lg:text-5xl text-3xl">Ma shortlist</h1>
            <input id="searchShortlist" type="text" placeholder="entrez le nom d'utilisateur..." class="bg-indigo-950 m-5 p-5 rounded-2xl w-full border">
            <p id="usersCounteur">0 candidat(s) dans votre shortlist</p>
        </div>
        <div id="shortlistC">
            <script type="module">
                import {shortlistCard} from "./shortlist.js"
                shortlistCard();
            </script>
        </div>
    </main>
    <div id="bgblur"
        class="flex justify-center w-full h-full bg-[rgba(0,0,0,0.5)] fixed inset-0 overflow-y-auto overflow-x-hidden fixed z-500 p-2 hidden">
        <div id="popup"
            class="bg-gradient-to-br from-[#11152F] via-[#29205C] to-[#49318B] bg-fixed rounded-2xl relative lg:w-150 max-sm:w-80 lg:h-130 flex-row text-start max-sm:justify-center max-sm:items-center mt-10 text-white">
            <div class=" m-3">
                <div class="flex">
                    <p class="m-3 ">mise à jour du profil</p>
                    <button id="AnnulerX" class="Annuler ml-auto justify-end m-2">X</button>
                </div>
                <h1 class="font-bold text-2xl ">Modifie le candidat</h1>
            </div>
            <div class="flex flex-col m-3">
                <label for="text" class="m-3">statut de recrutement</label>
                <select name="text" id="statut" class=" bg-indigo-950 p-3 rounded-2xl border">
                    <option value="À contacter">À contacter</option>
                    <option value="Entretien">Entretien</option>
                    <option value="Retenu">Retenu</option>
                    <option value="Refusé">Refusé</option>
                </select>
            </div>
            <div class="flex flex-col m-3">
                <label for="text" class="m-2">note</label>
                <select name="text" id="rate" class="bg-indigo-950 p-3 rounded-2xl border">
                    <option value="5/5">5/5</option>
                    <option value="4/5">4/5</option>
                    <option value="3/5">3/5</option>
                    <option value="2/5">2/5</option>
                    <option value="1/5">1/5</option>
                </select>
            </div>
            <div class="m-3 flex flex-col">
                <label for="text">note interne</label>
                <input type="text" id="note" placeholder="entrer la note" class="bg-indigo-950 m-2 p-5 rounded-2xl w-70 border">
            </div>
            <div class="flex flex-row ml-auto justify-end">
                <button id="Annuler" class="Annuler bg-[#1C2233] rounded-2xl p-2 m-2">Annuler</button>
                <button id="enregistrer" class="text-[#201744] m-2 bg-[#A78BFA] p-2 rounded-2xl hover:bg-[#8B5CF6] transition-color font-bold">Enregistrer</button>
            </div>

        </div>
    </div>
    
</body>
<script type="module" src="script.js" defer></script>
<script type="module" src="shortlist.js" defer></script>
</html>
